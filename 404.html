    <title>Linguo — Учи языки</title>
    <script>
      // Immediate Cache-Buster & SW Purge: ensures browser loads fresh UI instantly on any device
      const LINGUO_VER = '6.0.0-pro-ultimate-fix';
      const prevVer = localStorage.getItem('linguo_app_ver');
      if (prevVer !== LINGUO_VER) {
        localStorage.setItem('linguo_app_ver', LINGUO_VER);
        if ('caches' in window) {
          caches.keys().then((names) => Promise.all(names.map((name) => caches.delete(name))))
            .then(() => {
              if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations().then((regs) =>
                  Promise.all(regs.map((r) => r.unregister()))
                );
              }
            })
            .then(() => {
              if (prevVer) {
                // If the user had an older version cached, reload to fetch newest version
                window.location.reload(true);
              }
            });
        }
      }
    </script>
